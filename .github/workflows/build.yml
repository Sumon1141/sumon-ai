name: Build Sumon AI APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SumonAI"
          include ':app'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.sumon.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sumon.ai"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Sumon AI"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java
        run: |
          mkdir -p app/src/main/java/com/sumon/ai
          cat > app/src/main/java/com/sumon/ai/MainActivity.java <<'EOF'
          package com.sumon.ai;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {

              private TextToSpeech tts;
              private TextView status;
              private static final int REQ_SPEECH = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  tts = new TextToSpeech(this, this);

                  status = new TextView(this);
                  status.setTextSize(18);
                  status.setPadding(40, 80, 40, 40);
                  status.setText("Sumon AI à¦ªà§à¦°à¦¸à§à¦¤à§à¦¤!\nà¦¬à§‹à¦¤à¦¾à¦® à¦šà¦¾à¦ªà§à¦¨ à¦à¦¬à¦‚ à¦•à¦¥à¦¾ à¦¬à¦²à§à¦¨à¥¤");

                  Button mic = new Button(this);
                  mic.setText("ðŸŽ™ à¦•à¦¥à¦¾ à¦¬à¦²à§à¦¨");
                  mic.setOnClickListener(new Button.OnClickListener() {
                      @Override
                      public void onClick(android.view.View v) {
                          startListening();
                      }
                  });

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.addView(status);
                  layout.addView(mic);
                  setContentView(layout);
              }

              private void startListening() {
                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD");
                  try {
                      startActivityForResult(intent, REQ_SPEECH);
                  } catch (Exception e) {
                      Toast.makeText(this, "Google à¦…à§à¦¯à¦¾à¦ª à¦‡à¦¨à¦¸à§à¦Ÿà¦² à¦•à¦°à§à¦¨", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_SPEECH && resultCode == RESULT_OK && data != null) {
                      ArrayList<String> results =
                              data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (results != null && !results.isEmpty()) {
                          String heard = results.get(0);
                          status.setText("à¦†à¦ªà¦¨à¦¿ à¦¬à¦²à¦²à§‡à¦¨: " + heard);
                          reply(heard);
                      }
                  }
              }

              private void reply(String heard) {
                  String answer;
                  String h = heard.toLowerCase();
                  if (h.contains("à¦¹à§à¦¯à¦¾à¦²à§‹") || h.contains("hello")) {
                      answer = "à¦¹à§à¦¯à¦¾à¦²à§‹ à¦¸à§à¦®à¦¨ à¦­à¦¾à¦‡! à¦†à¦®à¦¿ à¦¸à§à¦®à¦¨ à¦ à¦†à¦‡à¥¤";
                  } else if (h.contains("à¦¸à¦®à¦¯à¦¼") || h.contains("time")) {
                      answer = "à¦à¦–à¦¨ à¦¸à¦®à¦¯à¦¼ " + new java.text.SimpleDateFormat("hh:mm a", Locale.getDefault())
                              .format(new java.util.Date());
                  } else if (h.contains("à¦¨à¦¾à¦®") || h.contains("name")) {
                      answer = "à¦†à¦®à¦¾à¦° à¦¨à¦¾à¦® à¦¸à§à¦®à¦¨ à¦ à¦†à¦‡à¥¤";
                  } else {
                      answer = "à¦†à¦ªà¦¨à¦¿ à¦¬à¦²à¦²à§‡à¦¨: " + heard;
                  }
                  tts.speak(answer, TextToSpeech.QUEUE_FLUSH, null, "sumon");
                  status.append("\nà¦¸à§à¦®à¦¨ AI: " + answer);
              }

              @Override
              public void onInit(int initStatus) {
                  if (initStatus == TextToSpeech.SUCCESS) {
                      tts.setLanguage(new Locale("bn", "BD"));
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumonAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
